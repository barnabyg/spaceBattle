name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Leave room for installation, all gates and the browser suite's 20-minute hang limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # The runner has no GPU: give Firefox a virtual display and Mesa's software OpenGL for WebGL.
      # Nor a sound device: give it a PulseAudio server with a silent sink, so Web Audio can start.
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libegl-mesa0 pulseaudio
      - run: pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink && pactl info
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run audit
      - run: npm run build
      - run: xvfb-run -a npm run e2e -- --headed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
